<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USC AI Knowledge Hub: learn how to use AI, for students and professors</title>
    <meta name="description" content="Grow your AI knowledge with learning paths for students, professors and researchers, honest guides to AI tools, and a video library refreshed every morning." />
    <meta name="theme-color" content="#990000" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,slnt,wdth,wght,GRAD,ROND@6..144,-10..0,25..151,1..1000,0..100,0..100&display=swap" />
    <!-- Pixel display face: accents on the tool map pop-up only, never body text. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
    <!-- The build writes each page's text into #root so it reads without scripts; the app replaces it on start. -->
    <style>
      .prerender { max-width: 760px; margin: 0 auto; padding: 32px 20px; font: 16px/1.6 system-ui, sans-serif; }
      .prerender h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 16px; }
      .prerender h2 { font-size: 1.35rem; margin: 28px 0 8px; }
      .prerender h3 { font-size: 1.1rem; margin: 20px 0 6px; }
    </style>
    <script>
      try {
        const t = localStorage.getItem("kh-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
