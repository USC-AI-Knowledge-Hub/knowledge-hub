name: CI

on:
  pull_request:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check every course and editors' pick exists on YouTube
        run: npm run courses -- --check --strict
      - run: npm run build

  firebase:
    # The AI Team board's security rules and the page's Firebase code, against Google's emulators.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:firebase
