name: Browser tests

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /
      - name: Check the tutor's model sizes against Hugging Face
        run: npx tsx scripts/model-sizes.ts
      - name: Run browser tests (including the real on-device model on WASM)
        # A wrong registry size shouldn't hide browser test results.
        if: ${{ !cancelled() }}
        run: npx playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
